name: Storefront catalog and navigation
on:
  pull_request:
    branches: [master]
    paths:
      - 'storefront-prototype/**'
      - 'ops/test-predani/**'
      - '.github/workflows/storefront-catalog.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  presentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
      - name: Build explicit offline fixtures and test presentation contracts
        run: |
          ANASTASIA_OFFLINE_FIXTURES=1 node storefront-prototype/build.mjs
          node --test storefront-prototype/test/*.test.mjs
          bash -n ops/test-predani/deploy.sh
          node --test ops/test-predani/deploy.test.mjs
