name: Admin store readiness
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'backend/src/lib/admin-readiness/**'
      - 'backend/src/api/admin/readiness/**'
      - 'backend/integration-tests/http/admin-readiness.spec.ts'
      - '.github/workflows/admin-readiness.yml'
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.6-bookworm
        env:
          POSTGRES_USER: readiness_synthetic
          POSTGRES_PASSWORD: readiness_synthetic_only
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U readiness_synthetic -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
      - name: Install locked dependencies
        run: npm ci --prefix backend --no-audit --no-fund
      - name: Check types and focused policy/API tests
        id: checks
        working-directory: backend
        env:
          TEST_TYPE: unit
          MEDUSA_TELEMETRY_DISABLED: 'true'
          NODE_OPTIONS: --experimental-vm-modules
        run: |
          ./node_modules/.bin/tsc --noEmit
          ./node_modules/.bin/jest --runTestsByPath src/lib/admin-readiness/__tests__/readiness.unit.spec.ts --runInBand --forceExit
      - name: Verify readiness over actual Medusa HTTP and PostgreSQL
        if: ${{ !cancelled() && steps.checks.outcome == 'success' }}
        working-directory: backend
        env:
          NODE_ENV: test
          MEDUSA_TELEMETRY_DISABLED: 'true'
          NODE_OPTIONS: --experimental-vm-modules --dns-result-order=ipv4first
          TEST_TYPE: integration:http
          DB_HOST: localhost
          DB_PORT: ${{ job.services.postgres.ports[5432] }}
          DB_USERNAME: readiness_synthetic
          DB_PASSWORD: readiness_synthetic_only
          DB_TEMP_NAME: anastasia_readiness_ci
          DATABASE_URL: postgres://readiness_synthetic:readiness_synthetic_only@localhost:${{ job.services.postgres.ports[5432] }}/anastasia_readiness_ci
          JWT_SECRET: synthetic-admin-readiness-jwt-only
          COOKIE_SECRET: synthetic-admin-readiness-cookie-only
        run: ./node_modules/.bin/jest --runTestsByPath integration-tests/http/admin-readiness.spec.ts --runInBand --forceExit
