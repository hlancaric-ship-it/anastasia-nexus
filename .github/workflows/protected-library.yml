name: Private purchased media
on:
  pull_request:
    branches: [master]
    paths:
      - 'protected-media/**'
      - 'anastasia-admin/**'
      - 'backend/src/api/admin/products/**'
      - 'backend/src/lib/protected-library/**'
      - '.github/workflows/protected-library.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
      - run: npm ci --prefix nexus --no-audit --no-fund
      - name: Verify signed private reads, ranges, expiry and CORS
        run: nexus/node_modules/.bin/vitest run --config protected-media/vitest.config.mjs
      - name: Verify compact purchased-content editor in Chrome
        run: node anastasia-admin/test/browser-library-editor.mjs
