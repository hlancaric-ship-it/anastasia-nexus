name: Wave 1 P0 isolated verification

on:
  push:
    branches: [codex/wave1-security]
    paths:
      - .github/workflows/wave1-p0.yml
      - nexus/**
      - backend/src/api/store/nexus-checkout/safeorder.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wave1-p0-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Node for dependency preparation
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.0
      - name: Prepare locked dependencies and disposable runtime
        working-directory: nexus
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          docker pull node:24.14.0-bookworm
          mkdir -p ../ci-evidence
          git rev-parse HEAD > ../ci-evidence/source-sha.txt
          docker image inspect node:24.14.0-bookworm --format '{{json .RepoDigests}}' > ../ci-evidence/runtime-image.json
      - name: Execute actual workerd and Nexus regression with no network
        run: |
          set -euo pipefail
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --read-only --tmpfs /tmp:rw,nosuid,size=1g \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace" \
            --workdir /workspace/nexus \
            --env HOME=/tmp --env CI=true --env WRANGLER_SEND_METRICS=false \
            node:24.14.0-bookworm bash -c '
              set -euo pipefail
              node --version
              uname -a
              npm run test:workers -- --reporter=verbose --reporter=json --outputFile=/workspace/ci-evidence/workerd.json
              npm run build
              ./node_modules/.bin/tsc -p tests/workers/tsconfig.json --noEmit
              npm test -- --reporter=default --reporter=json --outputFile=/workspace/ci-evidence/nexus.json
            ' 2>&1 | tee ci-evidence/runtime.log
      - name: Retain actual verification evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wave1-p0-${{ github.sha }}
          path: ci-evidence/
          if-no-files-found: error
          retention-days: 14
