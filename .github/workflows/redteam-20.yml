    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
      - name: Install pinned dependencies
        working-directory: nexus
        run: npm ci --no-audit --no-fund
      - name: Run independent synthetic scenario with no network
        if: matrix.suite == 'workers'
        run: |
          mkdir -p evidence
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges --read-only \
            --tmpfs /tmp:rw,exec,nosuid,size=1g \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace" \
            --workdir /workspace/nexus \
            --env HOME=/tmp --env CI=true --env WRANGLER_SEND_METRICS=false \
            node:24.14.0-bookworm \
            ./node_modules/.bin/vitest run -c vitest.workers.config.ts "tests/workers/${{ matrix.filter }}" --reporter=verbose \
            2>&1 | tee "evidence/${{ matrix.id }}.log"
      - name: Run pricing tests offline
        if: matrix.suite == 'unit'
        run: |
          mkdir -p evidence
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges --read-only \
            --tmpfs /tmp:rw,exec,nosuid,size=1g \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace" \
            --workdir /workspace/nexus \
            --env HOME=/tmp --env CI=true \
            node:24.14.0-bookworm \
            ./node_modules/.bin/vitest run "tests/unit/${{ matrix.filter }}" --reporter=verbose \
            2>&1 | tee "evidence/${{ matrix.id }}.log"
      - name: Retain independent evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: "redteam-${{ matrix.id }}"
          path: evidence/
          retention-days: 14
