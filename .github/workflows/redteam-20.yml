name: Red Team 100 isolated parallel checks
on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/redteam-20.yml"
      - "nexus/**"
      - "backend/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  redteam:
    name: "Isolated scenario ${{ matrix.id }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - { id: "001-isolated", filter: "AuditMoneyBoundaries.test.ts", suite: "unit" }
